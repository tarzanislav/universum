name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # MKVToolNix used by the Windows tests; the archive is checked against the official checksum list
  # and mkvmerge.exe against the official signer (LINET Services GmbH)
  MKVTOOLNIX_VERSION: '103.0'
  MKVTOOLNIX_PORTABLE_SHA256: '01D76DBFDBD5615D9E02F69B0710D1429A902D47A98C8EEE33BD884C4FCB3CBF'

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the runner image's .NET 10 SDK, else the Ubuntu package (the Microsoft download CDN answered 409)
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Install MKVToolNix (Ubuntu package)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mkvtoolnix && mkvmerge --version
      - name: Build core
        run: |
          dotnet build src/Universum.Core/Universum.Core.csproj -c Release
          dotnet build src/Universum.Platform.Windows/Universum.Platform.Windows.csproj -c Release
      - name: Tests
        run: dotnet run --project tests/Universum.Tests -c Release
      - name: Command line smoke test
        run: |
          set +e
          dotnet run --project src/Universum.Cli -c Release -- analyze testdata/media --output "$RUNNER_TEMP/universum-library"
          code=$?
          # 1 = some files need review (the test data contains undetermined languages); 2 would be an error
          if [ "$code" -ne 1 ]; then echo "::error::universum-cli analyze returned $code"; exit 1; fi

  # FFmpeg, whisper.cpp and the speech model for the installation (built once, then from the cache)
  speech-tools:
    uses: ./.github/workflows/speech-tools.yml

  windows:
    name: Build, self-test and installer (Windows)
    needs: speech-tools
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: speech-tools
          path: speech-tools

      - name: Speech tools for the tests
        shell: pwsh
        run: |
          "UNIVERSUM_SPEECH_DIR=$PWD\speech-tools\speech" >> $env:GITHUB_ENV
          & "speech-tools\speech\ffmpeg\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
      # the runner image's .NET 10 SDK, else the official install script from builds.dotnet.microsoft.com
      - name: .NET 10 SDK
        shell: pwsh
        run: |
          $sdks = & dotnet --list-sdks 2>$null
          # (the release workflow requires the SDK preinstalled; this notice tells whether it is)
          if ($sdks -match '^10\.') { Write-Host "::notice title=.NET 10 SDK::preinstalled on the runner" }
          else { Write-Host "::warning title=.NET 10 SDK::not preinstalled, installed with dotnet-install" }
          if (-not ($sdks -match '^10\.')) {
            Invoke-WebRequest https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
            & "$env:RUNNER_TEMP\dotnet-install.ps1" -Channel 10.0 -AzureFeed https://builds.dotnet.microsoft.com/dotnet -InstallDir "$env:ProgramFiles\dotnet"
          }
          dotnet --list-sdks

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = "0.1.${{ github.run_number }}"
          "number=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: MKVToolNix portable (checksum and signature verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:MKVTOOLNIX_VERSION
          $base = "https://mkvtoolnix.download/windows/releases/$v"
          $name = "mkvtoolnix-64-bit-$v.7z"
          $work = Join-Path $env:RUNNER_TEMP "mkvtoolnix-download"
          New-Item -ItemType Directory -Force $work | Out-Null
          Invoke-WebRequest "$base/$name" -OutFile (Join-Path $work $name)
          Invoke-WebRequest "$base/sha256sums.txt" -OutFile (Join-Path $work "sha256sums.txt")
          $expected = (Get-Content (Join-Path $work "sha256sums.txt") | Where-Object { $_ -match [regex]::Escape($name) + '$' } | ForEach-Object { ($_ -split '\s+')[0] }) | Select-Object -First 1
          $actual = (Get-FileHash (Join-Path $work $name) -Algorithm SHA256).Hash
          if (-not $expected -or $expected.ToUpperInvariant() -ne $actual) { throw "SHA-256 mismatch for $name (expected $expected, actual $actual)" }
          if ($actual -ne $env:MKVTOOLNIX_PORTABLE_SHA256) { throw "SHA-256 of $name differs from the pinned value" }
          Write-Host "::notice title=MKVToolNix $v::$name SHA-256 $actual"
          $target = Join-Path $env:RUNNER_TEMP "mkvtoolnix"
          7z x -y "-o$target" (Join-Path $work $name) | Out-Null
          $mkvmerge = Get-ChildItem $target -Recurse -Filter mkvmerge.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $mkvmerge.FullName
          $signer = $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($signature.Status -ne 'Valid' -or $signer -cne 'LINET Services GmbH') {
            throw "mkvmerge.exe signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          & $mkvmerge.FullName --version
          "UNIVERSUM_MKVTOOLNIX_DIR=$($mkvmerge.DirectoryName)" >> $env:GITHUB_ENV

      - name: MKVToolNix release feed (format check)
        shell: pwsh
        run: |
          $feed = Join-Path $env:RUNNER_TEMP "latest-release.xml.gz"
          Invoke-WebRequest "https://mkvtoolnix.download/latest-release.xml.gz" -OutFile $feed
          $stream = [IO.Compression.GZipStream]::new([IO.File]::OpenRead($feed), [IO.Compression.CompressionMode]::Decompress)
          $xml = [IO.StreamReader]::new($stream).ReadToEnd()
          $flat = ($xml -replace '\s+', ' ')
          Write-Host "::notice title=latest-release.xml::$($flat.Substring(0, [Math]::Min(900, $flat.Length)))"
          "UNIVERSUM_LATEST_RELEASE_XML=$feed" >> $env:GITHUB_ENV

      - name: Core tests
        run: dotnet run --project tests/Universum.Tests -c Release

      - name: Publish program
        shell: pwsh
        run: |
          # compiler errors become annotations (job logs are not always available)
          $output = & dotnet publish src/Universum.Cli/Universum.Cli.csproj -c Release -r win-x64 --self-contained true `
            "-p:Version=${{ steps.version.outputs.number }}" -o publish 2>&1
          $output += & dotnet publish src/Universum.App/Universum.App.csproj -c Release -r win-x64 --self-contained true `
            "-p:Version=${{ steps.version.outputs.number }}" -o publish 2>&1
          $code = $LASTEXITCODE
          # the speech tools are installed with the program
          Copy-Item -Recurse -Force speech-tools\speech publish\speech
          $output | ForEach-Object { Write-Host $_ }
          $output | Where-Object { $_ -match ': (error|warning) [A-Z]+\d+' } | Select-Object -Unique -First 30 | ForEach-Object {
            $line = "$_" -replace '%', '%25'
            if ($line -match ': error ') { Write-Host "::error::$line" } else { Write-Host "::warning::$line" }
          }
          exit $code

      - name: Self-test
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest"
          $env:UNIVERSUM_SELFTEST_DIR = $out
          $env:UNIVERSUM_TESTDATA = Join-Path $PWD "testdata"
          $p = Start-Process -FilePath "publish\Universum.exe" -ArgumentList "--samotest" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Host "::error::Self-test did not finish within 10 minutes"; exit 1 }
          $log = Join-Path $out "selftest.log"
          if (Test-Path $log) {
            Get-Content $log
            Get-Content $log | Where-Object { $_ -match ' ERROR ' } | Select-Object -First 10 | ForEach-Object { Write-Host "::error title=Self-test::$($_ -replace '%', '%25')" }
          } else {
            Write-Host "::error::Self-test wrote no log (exit code $($p.ExitCode))"
          }
          if ($p.ExitCode -ne 0) { Write-Host "::error::Self-test exit code $($p.ExitCode)"; exit 1 }
          & publish\universum-cli.exe analyze testdata\media --output "$env:RUNNER_TEMP\universum-library"
          if ($LASTEXITCODE -ne 1) { Write-Host "::error::universum-cli.exe analyze returned $LASTEXITCODE"; exit 1 }
          exit 0
          Write-Host "::notice::Self-test OK"

      - name: Self-test output (log and screenshots)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-${{ steps.version.outputs.number }}
          path: ${{ runner.temp }}/selftest
          retention-days: 14

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # (the release workflow requires Inno Setup preinstalled; this notice tells whether it is)
          if (Test-Path $iscc) { Write-Host "::notice title=Inno Setup::preinstalled on the runner" }
          else { Write-Host "::warning title=Inno Setup::not preinstalled, installed with choco"; choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.version.outputs.number }}" "/DSourceDir=$PWD\publish" installer\universum.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = "installer\Output\UNIVERSUM_Setup_${{ steps.version.outputs.number }}.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          Write-Host "::notice title=Installer::UNIVERSUM_Setup_${{ steps.version.outputs.number }}.exe SHA-256 $hash"

      - name: Installer download (14 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UNIVERSUM_Setup_${{ steps.version.outputs.number }}
          path: installer/Output/UNIVERSUM_Setup_${{ steps.version.outputs.number }}.exe
          retention-days: 14

  # Screenshots and log of the self-test are pushed to the branch "selftest-output" for review of the UI
  # (development branches only). Only this small job may write to the repository.
  selftest-output:
    name: Self-test output to branch
    needs: windows
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: selftest-*
          path: selftest
          merge-multiple: true
      - name: Push to selftest-output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd selftest
          rm -rf settings unsigned.exe
          git init -q -b selftest-output
          git config user.name "UNIVERSUM CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Self-test output of ${{ github.sha }} (${{ github.ref_name }})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" selftest-output
